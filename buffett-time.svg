<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="שני עמודים של ההון של וורן באפט לפי פורבס: עמוד נמוך של כ-11.8 מיליארד דולר בגיל 65 ב-1995, ועמוד זהוב גבוה פי 12 של כ-144.9 מיליארד דולר באוקטובר 2024">
  <defs>
    <linearGradient id="bgt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF9F4"/><stop offset="1" stop-color="#F1EBDD"/></linearGradient>
    <linearGradient id="goldt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCBD62"/><stop offset="1" stop-color="#C9A33F"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgt)"/>
  <circle cx="760" cy="300" r="260" fill="#C9A33F" opacity="0.07"/>
  <line x1="240" y1="540" x2="960" y2="540" stroke="#B3AB99" stroke-width="5" stroke-linecap="round"/>
  <rect x="330" y="501.7" width="170" height="38.3" rx="10" fill="#C2BAA8" stroke="#A39B88" stroke-width="4"/>
  <rect x="680" y="70" width="170" height="470" rx="14" fill="url(#goldt)" stroke="#A98429" stroke-width="4"/>
  <line x1="684" y1="501.7" x2="846" y2="501.7" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" opacity="0.9"/>
  <g font-family="Assistant, 'Segoe UI', Arial, sans-serif" text-anchor="middle" direction="rtl">
    <text x="415" y="480" font-size="34" font-weight="700" fill="#6b6455">11.8 מיליארד $</text>
    <text x="765" y="300" font-size="38" font-weight="700" fill="#ffffff">144.9</text>
    <text x="765" y="342" font-size="28" font-weight="700" fill="#ffffff">מיליארד $</text>
    <text x="415" y="580" font-size="30" font-weight="700" fill="#8d8677">גיל 65</text>
    <text x="415" y="614" font-size="24" fill="#9d9687">1995</text>
    <text x="765" y="580" font-size="30" font-weight="700" fill="#1a1a1a">גיל 94</text>
