    <text x="600" y="678" font-size="40" font-weight="700" fill="#1a1a1a">יותר מ-90% מההון נוסף אחרי גיל 65</text>
    <text x="600" y="718" font-size="26" fill="#7a746a">הערכות שווי הון של פורבס</text>
