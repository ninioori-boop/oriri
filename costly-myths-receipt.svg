<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="קבלה ארוכה עם חמישה מיתוסים על כסף שכל אחד מהם מסומן באיקס, ובשורה התחתונה המחיר הוא הכסף שלכם, ולצידה ערימת מטבעות שחלק מהמטבעות עפים ממנה">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="1" stop-color="#F1EBDD"/>
    </linearGradient>
    <linearGradient id="goldm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCBD62"/>
      <stop offset="1" stop-color="#C9A33F"/>
    </linearGradient>
    <filter id="shm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6b5a2e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgm)"/>
  <circle cx="330" cy="400" r="260" fill="#C9A33F" opacity="0.07"/>

  <!-- הקבלה -->
  <path d="M600,56 H1090 V660 L1074.7,676 L1059.4,660 L1044.1,676 L1028.8,660 L1013.4,676 L998.1,660 L982.8,676 L967.5,660 L952.2,676 L936.9,660 L921.6,676 L906.2,660 L890.9,676 L875.6,660 L860.3,676 L845.0,660 L829.7,676 L814.4,660 L799.1,676 L783.8,660 L768.4,676 L753.1,660 L737.8,676 L722.5,660 L707.2,676 L691.9,660 L676.6,676 L661.2,660 L645.9,676 L630.6,660 L615.3,676 L600.0,660 Z" fill="#ffffff" filter="url(#shm)"/>
  <g font-family="Assistant, 'Segoe UI', Arial, sans-serif">
    <text x="845" y="128" font-size="42" font-weight="700" fill="#1a1a1a" text-anchor="middle" direction="rtl" unicode-bidi="embed">5 מיתוסים</text>
    <line x1="634" y1="160" x2="1056" y2="160" stroke="#DBD3C0" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
    <text x="1050" y="222" font-size="31" fill="#4a4a4a" text-anchor="end">לחסוך בכל מחיר</text>
    <circle cx="658" cy="212" r="19" fill="url(#goldm)"/>
    <path d="M651,205 L665,219 M665,205 L651,219" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="1050" y="292" font-size="31" fill="#4a4a4a" text-anchor="end">לבחור מניות לבד</text>
    <circle cx="658" cy="282" r="19" fill="url(#goldm)"/>
    <path d="M651,275 L665,289 M665,275 L651,289" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="1050" y="362" font-size="31" fill="#4a4a4a" text-anchor="end">לחכות שהשוק ירד</text>
    <circle cx="658" cy="352" r="19" fill="url(#goldm)"/>
    <path d="M651,345 L665,359 M665,345 L651,359" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="1050" y="432" font-size="31" fill="#4a4a4a" text-anchor="end">מזומן זה בטוח</text>
    <circle cx="658" cy="422" r="19" fill="url(#goldm)"/>
    <path d="M651,415 L665,429 M665,415 L651,429" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="1050" y="502" font-size="31" fill="#4a4a4a" text-anchor="end">לבדוק את התיק כל יום</text>
    <circle cx="658" cy="492" r="19" fill="url(#goldm)"/>
    <path d="M651,485 L665,499 M665,485 L651,499" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="634" y1="560" x2="1056" y2="560" stroke="#DBD3C0" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
    <text x="1050" y="618" font-size="34" font-weight="700" fill="#1a1a1a" text-anchor="end">המחיר</text>
    <text x="640" y="618" font-size="34" font-weight="700" fill="#A98429" text-anchor="start">הכסף שלכם</text>
  </g>

  <!-- ערימת מטבעות -->
  <path d="M238,560 V576 A92,26 0 0 0 422,576 V560 Z" fill="#A98429"/>
  <ellipse cx="330" cy="560" rx="92" ry="26" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
  <path d="M238,536 V552 A92,26 0 0 0 422,552 V536 Z" fill="#A98429"/>
  <ellipse cx="330" cy="536" rx="92" ry="26" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
  <path d="M238,512 V528 A92,26 0 0 0 422,528 V512 Z" fill="#A98429"/>
  <ellipse cx="330" cy="512" rx="92" ry="26" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
  <path d="M238,488 V504 A92,26 0 0 0 422,504 V488 Z" fill="#A98429"/>
  <ellipse cx="330" cy="488" rx="92" ry="26" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
  <path d="M238,464 V480 A92,26 0 0 0 422,480 V464 Z" fill="#A98429"/>
  <ellipse cx="330" cy="464" rx="92" ry="26" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
  <path d="M238,440 V456 A92,26 0 0 0 422,456 V440 Z" fill="#A98429"/>
  <ellipse cx="330" cy="440" rx="92" ry="26" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
  <ellipse cx="330" cy="440" rx="62" ry="16" fill="none" stroke="#A98429" stroke-width="3" opacity="0.5"/>

  <!-- מטבעות שעפים -->
  <g opacity="1">
    <circle cx="250" cy="300" r="34" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
    <circle cx="250" cy="300" r="21.1" fill="none" stroke="#A98429" stroke-width="2.5" opacity="0.55"/>
  </g>
  <g opacity="0.8">
    <circle cx="170" cy="200" r="28" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
    <circle cx="170" cy="200" r="17.4" fill="none" stroke="#A98429" stroke-width="2.5" opacity="0.55"/>
  </g>
  <g opacity="0.6">
    <circle cx="330" cy="150" r="24" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
    <circle cx="330" cy="150" r="14.9" fill="none" stroke="#A98429" stroke-width="2.5" opacity="0.55"/>
  </g>
  <g opacity="0.4">
    <circle cx="115" cy="95" r="19" fill="url(#goldm)" stroke="#A98429" stroke-width="3"/>
    <circle cx="115" cy="95" r="11.8" fill="none" stroke="#A98429" stroke-width="2.5" opacity="0.55"/>
  </g>
  <line x1="300" y1="380" x2="278" y2="346" stroke="#C2BAA8" stroke-width="4" stroke-linecap="round"/>
  <line x1="212" y1="262" x2="196" y2="236" stroke="#C2BAA8" stroke-width="4" stroke-linecap="round"/>
  <line x1="345" y1="205" x2="338" y2="182" stroke="#C2BAA8" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Assistant, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="330" y="672" font-size="44" font-weight="700" fill="#1a1a1a">נשמע הגיוני</text>
    <text x="330" y="714" font-size="28" fill="#7a746a">ועולה לכם ביוקר</text>
  </g>
</svg>
