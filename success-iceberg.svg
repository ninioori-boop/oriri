<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="קרחון: מעל המים רק קצה זהוב קטן שמסמל את התוצאה, ומתחת למים גוש גדול שמסמל את הדרך, התנאים והסיכון שמאחוריה">
  <defs>
    <linearGradient id="bgi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF9F4"/><stop offset="1" stop-color="#F4EFE4"/></linearGradient>
    <linearGradient id="wateri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9E3D6"/><stop offset="1" stop-color="#DDD5C3"/></linearGradient>
    <linearGradient id="goldi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCBD62"/><stop offset="1" stop-color="#C9A33F"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bgi)"/>
  <rect x="0" y="300" width="1200" height="450" fill="url(#wateri)"/>
  <path d="M0,300 Q75,288 150,300 T300,300 T450,300 T600,300 T750,300 T900,300 T1050,300 T1200,300" fill="none" stroke="#B3AB99" stroke-width="4"/>
