  <g font-family="Assistant, 'Segoe UI', Arial, sans-serif" text-anchor="middle" direction="rtl">
    <text x="980" y="190" font-size="42" font-weight="700" fill="#1a1a1a">התוצאה</text>
    <text x="980" y="234" font-size="28" fill="#7a746a">מה שכולם רואים</text>
    <text x="645" y="470" font-size="40" font-weight="700" fill="#4a4339">הדרך, התנאים</text>
