<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="בית אחד ששתי הלוואות קשורות אליו, משכנתא והלוואה חדשה. מתחתיו פס של ההכנסה הפנויה, ושתי ההלוואות יחד ממלאות 52.5 אחוז ממנו, מעבר לקו של 40 אחוז ומעבר לתקרה של 50 אחוז">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="1" stop-color="#F1EBDD"/>
    </linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A33F"/>
      <stop offset="1" stop-color="#E5C870"/>
    </linearGradient>
    <clipPath id="barclip">
      <rect x="150" y="440" width="900" height="84" rx="42"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bgh)"/>
  <circle cx="860" cy="250" r="230" fill="#C9A33F" opacity="0.07"/>

  <!-- the home -->
  <path d="M790,240 L880,160 L970,240" fill="none" stroke="#C9A33F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="808" y="236" width="144" height="110" rx="8" fill="#ffffff" stroke="#C9A33F" stroke-width="8"/>
  <rect x="862" y="282" width="36" height="64" rx="4" fill="#C9A33F"/>
  <rect x="822" y="256" width="28" height="24" rx="3" fill="#F1E3B8"/>
  <rect x="910" y="256" width="28" height="24" rx="3" fill="#F1E3B8"/>

  <!-- both loans are tied to the same home -->
  <path d="M880,346 C880,390 915,400 915,432" fill="none" stroke="#8d8677" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M880,346 C880,400 684,390 684,432" fill="none" stroke="#C9A33F" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- disposable income bar, filled right to left -->
  <rect x="150" y="440" width="900" height="84" rx="42" fill="#ffffff" stroke="#E2DACA" stroke-width="3"/>
  <g clip-path="url(#barclip)">
    <rect x="780" y="440" width="270" height="84" fill="#8d8677"/>
    <rect x="577" y="440" width="203" height="84" fill="url(#goldh)"/>
    <rect x="577" y="440" width="23" height="84" fill="#C0504D" opacity="0.55"/>
  </g>
  <rect x="150" y="440" width="900" height="84" rx="42" fill="none" stroke="#E2DACA" stroke-width="3"/>

  <!-- thresholds -->
  <line x1="690" y1="402" x2="690" y2="432" stroke="#A8862A" stroke-width="4" stroke-linecap="round"/>
  <line x1="690" y1="532" x2="690" y2="560" stroke="#A8862A" stroke-width="4" stroke-linecap="round"/>
  <text x="690" y="390" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="800" fill="#A8862A">40%</text>
  <line x1="600" y1="402" x2="600" y2="432" stroke="#C0504D" stroke-width="4" stroke-linecap="round"/>
  <line x1="600" y1="532" x2="600" y2="560" stroke="#C0504D" stroke-width="4" stroke-linecap="round"/>
  <text x="600" y="390" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="800" fill="#C0504D">50%</text>

  <!-- the result -->
  <path d="M577,566 v30" stroke="#C0504D" stroke-width="4" stroke-linecap="round"/>
  <text x="577" y="640" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="46" font-weight="800" fill="#C0504D">52.5%</text>

  <!-- amounts inside the bar -->
  <text x="915" y="494" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">6,000</text>
  <text x="684" y="494" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="800" fill="#2a2418">4,500</text>
  <text x="365" y="494" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="30" font-weight="700" fill="#B3AB99">20,000</text>
</svg>
